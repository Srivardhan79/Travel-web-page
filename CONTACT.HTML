 <section class="contact" id="contact">
    <h1>Contact Us</h1>
    <p class="contact-text">
        Have questions about your next trip?
        Send us a message and we will get back to you!
    </p>
    <form action="https://formsubmit.co/ssrivardhan.cs26@bitsathy.ac.in"
          method="POST">
        <input type="text" name="name" placeholder="Your Full Name" required>
        <input type="email" name="email" placeholder="Your Email Address" required>
        <input type="tel"name="phone"  placeholder="Your Phone Number">
        <select name="package" required>
            <option value="" disabled selected>
                Select Travel Package
            </option>
            <option>Special Package</option>
            <option>School Package</option>
            <option>Corporate Package</option>
            <option>Family Package</option>
            <option>International Package</option>
            <option>Custom Travel Package</option>
        </select>
        <textarea name="message" placeholder="Your Message" rows="5"  required></textarea>
        <input type="hidden" name="_subject"  value="New Travel Website Enquiry">
        <button type="submit">Send Message</button>
    </form>
</section>
</body>
</html>
